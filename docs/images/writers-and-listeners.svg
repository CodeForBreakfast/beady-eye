<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">
<title>Writers change beads in a tracker, bdi watch sees each change, and tells the Claude Code plugin, the view and scripts on its socket. Two pseudopods run from the eye back into the tracker: bdi gates and bdi bd.</title>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#efe2c4"/>
  </marker>
  <marker id="tentacle-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#5fae9b"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="10" fill="#0e1d1a"/>

<text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#efe2c4">Anything that writes to a bead reaches whoever watches it</text>

<!-- writers -->
<text x="30" y="188" font-size="12" letter-spacing="2" fill="#5fae9b">WRITERS</text>
<g fill="none" stroke="#5fae9b" stroke-width="1.5">
  <rect x="30" y="204" width="210" height="52" rx="6"/>
  <rect x="30" y="274" width="210" height="52" rx="6"/>
  <rect x="30" y="344" width="210" height="52" rx="6"/>
</g>
<g fill="#efe2c4">
  <text x="44" y="226" font-size="15">people</text>
  <text x="44" y="245" fill="#a9b8ad">with <tspan font-family="ui-monospace, Menlo, Consolas, monospace">bd</tspan></text>
  <text x="44" y="296" font-size="15">other agents</text>
  <text x="44" y="315" fill="#a9b8ad">claiming, commenting, closing</text>
  <text x="44" y="366" font-size="15">scripts and CI</text>
  <text x="44" y="385" fill="#a9b8ad">any job that can reach the tracker</text>
</g>
<g stroke="#efe2c4" stroke-width="1.5" fill="none" marker-end="url(#head)">
  <path d="M240 230 L314 270"/>
  <path d="M240 300 L314 300"/>
  <path d="M240 370 L314 330"/>
</g>

<!-- the tracker -->
<rect x="318" y="220" width="170" height="160" rx="8" fill="#13302a" stroke="#efe2c4" stroke-width="1.5"/>
<text x="403" y="250" text-anchor="middle" font-size="15" fill="#efe2c4">a beads tracker</text>
<g fill="#5fae9b">
  <circle cx="351" cy="300" r="7"/><circle cx="369" cy="300" r="7"/><circle cx="387" cy="300" r="7"/>
  <circle cx="405" cy="300" r="7"/><circle cx="423" cy="300" r="7"/><circle cx="441" cy="300" r="7"/>
  <circle cx="459" cy="300" r="7"/>
</g>
<text x="403" y="350" text-anchor="middle" fill="#a9b8ad">the bead is the address,</text>
<text x="403" y="367" text-anchor="middle" fill="#a9b8ad">and it keeps the message</text>

<!-- the watcher -->
<path d="M488 300 L560 300" stroke="#efe2c4" stroke-width="1.5" fill="none" marker-end="url(#head)"/>
<path d="M566 300 Q630 240 694 300 Q630 360 566 300 Z" fill="#efe2c4"/>
<circle cx="630" cy="300" r="23" fill="#2f5e55"/>
<circle cx="630" cy="300" r="10" fill="#c43a2c"/>
<circle cx="623" cy="292" r="4" fill="#efe2c4"/>
<text x="645" y="238" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#efe2c4">bdi watch</text>
<text x="645" y="256" text-anchor="middle" fill="#a9b8ad">one per machine</text>

<!-- listeners -->
<text x="750" y="188" font-size="12" letter-spacing="2" fill="#5fae9b">LISTENERS</text>
<g stroke="#efe2c4" stroke-width="1.5" fill="none" marker-end="url(#head)">
  <path d="M694 300 L744 230"/>
  <path d="M694 300 L744 300"/>
  <path d="M694 300 L744 370"/>
</g>
<g fill="none" stroke="#5fae9b" stroke-width="1.5">
  <rect x="750" y="204" width="200" height="52" rx="6"/>
  <rect x="750" y="274" width="200" height="52" rx="6"/>
  <rect x="750" y="344" width="200" height="52" rx="6"/>
</g>
<g fill="#efe2c4">
  <text x="764" y="226" font-size="15">the Claude Code plugin</text>
  <text x="764" y="245" fill="#a9b8ad">wakes the session that waits</text>
  <text x="764" y="296" font-size="15">the view</text>
  <text x="764" y="315" fill="#a9b8ad">redraws the trees of work</text>
  <text x="764" y="366" font-size="15">scripts</text>
  <text x="764" y="385" fill="#a9b8ad">a line of JSON per change</text>
</g>

<!-- pseudopods -->
<g stroke="#5fae9b" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#tentacle-head)">
  <path d="M582 288 C568 180, 470 160, 455 212"/>
  <path d="M582 312 C568 420, 470 440, 455 388"/>
</g>
<text x="490" y="106" text-anchor="middle" fill="#5fae9b" font-size="12" letter-spacing="2">PSEUDOPOD</text>
<text x="490" y="125" text-anchor="middle" fill="#efe2c4"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">bdi gates</tspan> closes a gate once the pull request, issue, release,</text>
<text x="490" y="143" text-anchor="middle" fill="#efe2c4">workflow run, timer or bead it awaits says the wait is over,</text>
<text x="490" y="161" text-anchor="middle" fill="#efe2c4">and comments on the waiting bead when its pull request has news</text>
<text x="490" y="438" text-anchor="middle" fill="#5fae9b" font-size="12" letter-spacing="2">PSEUDOPODS</text>
<text x="490" y="457" text-anchor="middle" fill="#efe2c4"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">bdi bd</tspan> carries a person's answer, deferral or comment</text>
<text x="490" y="475" text-anchor="middle" fill="#efe2c4">to one project's tracker, and nothing else</text>
</svg>

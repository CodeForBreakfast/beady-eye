<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13">
<title>Writers change beads in a tracker, bdi watch sees each change, and tells the Claude Code plugin, the view and scripts on its socket. Two pseudopods run from the eye into the tracker: bdi gates, which reads GitHub, the clock and other beads, and bdi bd.</title>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#efe2c4"/>
  </marker>
  <marker id="tentacle-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#5fae9b"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="10" fill="#0e1d1a"/>

<text x="30" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#efe2c4">Anything that writes to a bead reaches whoever watches it</text>

<!-- sources bdi gates reads -->
<text x="318" y="90" font-size="12" letter-spacing="2" fill="#5fae9b">SOURCES</text>
<g fill="none" stroke="#a9b8ad" stroke-width="1.5" stroke-dasharray="4 3">
  <rect x="318" y="102" width="230" height="48" rx="6"/>
  <rect x="562" y="102" width="120" height="48" rx="6"/>
  <rect x="696" y="102" width="200" height="48" rx="6"/>
</g>
<g fill="#efe2c4">
  <text x="332" y="122" font-size="15">GitHub</text>
  <text x="332" y="140" fill="#a9b8ad">pull requests, issues, releases, runs</text>
  <text x="576" y="122" font-size="15">the clock</text>
  <text x="576" y="140" fill="#a9b8ad">a timer's deadline</text>
  <text x="710" y="122" font-size="15">other beads</text>
  <text x="710" y="140" fill="#a9b8ad">in any configured tracker</text>
</g>
<g stroke="#efe2c4" stroke-width="1.5" fill="none" marker-end="url(#head)">
  <path d="M433 150 L433 184"/>
  <path d="M622 150 L622 184"/>
  <path d="M796 150 L740 184"/>
</g>

<!-- writers -->
<text x="30" y="268" font-size="12" letter-spacing="2" fill="#5fae9b">WRITERS</text>
<g fill="none" stroke="#5fae9b" stroke-width="1.5">
  <rect x="30" y="284" width="210" height="52" rx="6"/>
  <rect x="30" y="354" width="210" height="52" rx="6"/>
  <rect x="30" y="424" width="210" height="52" rx="6"/>
</g>
<g fill="#efe2c4">
  <text x="44" y="306" font-size="15">people</text>
  <text x="44" y="325" fill="#a9b8ad">with <tspan font-family="ui-monospace, Menlo, Consolas, monospace">bd</tspan></text>
  <text x="44" y="376" font-size="15">other agents</text>
  <text x="44" y="395" fill="#a9b8ad">claiming, commenting, closing</text>
  <text x="44" y="446" font-size="15">scripts and CI</text>
  <text x="44" y="465" fill="#a9b8ad">any job that can reach the tracker</text>
</g>
<g stroke="#efe2c4" stroke-width="1.5" fill="none" marker-end="url(#head)">
  <path d="M240 310 L314 350"/>
  <path d="M240 380 L314 380"/>
  <path d="M240 450 L314 410"/>
</g>

<!-- pseudopods, drawn under the boxes they pass behind -->
<g stroke="#5fae9b" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#tentacle-head)">
  <path d="M600 356 C600 200, 403 200, 403 292"/>
  <path d="M582 392 C568 500, 470 520, 455 468"/>
</g>

<!-- bdi gates -->
<rect x="318" y="186" width="578" height="64" rx="8" fill="#13302a" stroke="#5fae9b" stroke-width="2"/>
<text x="332" y="208" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#efe2c4">bdi gates</text>
<text x="882" y="208" text-anchor="end" font-size="12" letter-spacing="2" fill="#5fae9b">PSEUDOPOD</text>
<text x="332" y="226" fill="#efe2c4">closes a gate once the pull request, issue, release, run, timer or bead it awaits</text>
<text x="332" y="242" fill="#efe2c4">says the wait is over, and comments on the waiting bead when its pull request has news</text>

<!-- the tracker -->
<rect x="318" y="300" width="170" height="160" rx="8" fill="#13302a" stroke="#efe2c4" stroke-width="1.5"/>
<text x="403" y="330" text-anchor="middle" font-size="15" fill="#efe2c4">a beads tracker</text>
<g fill="#5fae9b">
  <circle cx="351" cy="380" r="7"/><circle cx="369" cy="380" r="7"/><circle cx="387" cy="380" r="7"/>
  <circle cx="405" cy="380" r="7"/><circle cx="423" cy="380" r="7"/><circle cx="441" cy="380" r="7"/>
  <circle cx="459" cy="380" r="7"/>
</g>
<text x="403" y="430" text-anchor="middle" fill="#a9b8ad">the bead is the address,</text>
<text x="403" y="447" text-anchor="middle" fill="#a9b8ad">and it keeps the message</text>

<!-- the watcher -->
<path d="M488 380 L560 380" stroke="#efe2c4" stroke-width="1.5" fill="none" marker-end="url(#head)"/>
<path d="M566 380 Q630 320 694 380 Q630 440 566 380 Z" fill="#efe2c4"/>
<circle cx="630" cy="380" r="23" fill="#2f5e55"/>
<circle cx="630" cy="380" r="10" fill="#c43a2c"/>
<circle cx="623" cy="372" r="4" fill="#efe2c4"/>
<text x="665" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#efe2c4">bdi watch</text>
<text x="665" y="336" text-anchor="middle" fill="#a9b8ad">one per machine</text>

<!-- listeners -->
<text x="750" y="268" font-size="12" letter-spacing="2" fill="#5fae9b">LISTENERS</text>
<g stroke="#efe2c4" stroke-width="1.5" fill="none" marker-end="url(#head)">
  <path d="M694 380 L744 310"/>
  <path d="M694 380 L744 380"/>
  <path d="M694 380 L744 450"/>
</g>
<g fill="none" stroke="#5fae9b" stroke-width="1.5">
  <rect x="750" y="284" width="200" height="52" rx="6"/>
  <rect x="750" y="354" width="200" height="52" rx="6"/>
  <rect x="750" y="424" width="200" height="52" rx="6"/>
</g>
<g fill="#efe2c4">
  <text x="764" y="306" font-size="15">the Claude Code plugin</text>
  <text x="764" y="325" fill="#a9b8ad">wakes the session that waits</text>
  <text x="764" y="376" font-size="15">the view</text>
  <text x="764" y="395" fill="#a9b8ad">redraws the trees of work</text>
  <text x="764" y="446" font-size="15">scripts</text>
  <text x="764" y="465" fill="#a9b8ad">a line of JSON per change</text>
</g>

<!-- bdi bd -->
<text x="490" y="518" text-anchor="middle" fill="#5fae9b" font-size="12" letter-spacing="2">PSEUDOPODS</text>
<text x="490" y="537" text-anchor="middle" fill="#efe2c4"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">bdi bd</tspan> carries a person's answer, deferral or comment</text>
<text x="490" y="555" text-anchor="middle" fill="#efe2c4">to one project's tracker, and nothing else</text>
</svg>

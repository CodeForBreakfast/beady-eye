name: CI

on:
  push:
    branches: [main]
    # The tracker writes to .beads on main constantly. Those commits change no
    # code, so they must not spend a runner.
    paths-ignore:
      - '.beads/**'

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check
    runs-on: homelab-runners
    timeout-minutes: 60
    steps:
      # Actions are pinned by commit because a tag is mutable and an action
      # runs with this repository's token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Every check comes from the flake's `checks` output, so a check added
      # there is a check this runs. Naming one here is the drift to avoid.
      - run: nix flake check -L

      # Building bd is most of this job — four minutes of seven, to give
      # tests/no_config.rs a real bd to run against. Nothing about it depends on
      # our source, so every commit rebuilt a binary the last commit had already
      # built and discarded.
      #
      # The paths come out of the derivation graph rather than a match against
      # the store, so moving the beads pin moves what this seeds instead of
      # quietly seeding the version the pin used to name.
      - name: seed the beads build into the shared cache
        run: |
          check=$(nix path-info --derivation .#checks.x86_64-linux.build-and-test)
          mapfile -t drvs < <(nix-store -qR --include-outputs "$check" |
            grep -E '/[a-z0-9]+-beads-[^/]*\.drv$')
          test "${#drvs[@]}" -gt 0

          # --outputs answers from the derivation, so it names paths that were
          # never realised: once bd itself substitutes, nothing builds its
          # module closure and that output is not on this machine to push.
          mapfile -t paths < <(nix-store -q --outputs "${drvs[@]}")
          seed=()
          for path in "${paths[@]}"; do
            if nix-store --check-validity "$path" 2>/dev/null; then
              seed+=("$path")
            fi
          done
          test "${#seed[@]}" -gt 0
          printf 'seeding %s\n' "${seed[@]}"

          # --inputs-from takes attic from this flake's locked nixpkgs. A bare
          # nixpkgs# resolves through the installer's registry to a weekly
          # channel, which is an unpinned dependency of every CI run.
          attic() { nix run --inputs-from . nixpkgs#attic-client -- "$@"; }

          attic login homelab https://cache.example.invalid "$ATTIC_TOKEN"
          attic push homelab "${seed[@]}"

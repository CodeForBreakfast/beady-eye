name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check
    runs-on: homelab-runners
    timeout-minutes: 60
    steps:
      # Actions are pinned by commit because a tag is mutable and an action
      # runs with this repository's token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Every check comes from the flake's `checks` output, so a check added
      # there is a check this runs. Naming one here is the drift to avoid.
      - run: nix flake check -L

      # Two of the builds behind that check say nothing about this repository:
      # bd, which tests/no_config.rs needs a real copy of, and the crate's
      # dependency graph, which is keyed on Cargo.lock. Left to itself every
      # commit compiles what the commit before it had already compiled and
      # thrown away, and between them that is nearly the whole job. Seeding
      # them here is what lets the next run substitute them instead.
      #
      # The paths come out of the derivation graph rather than a match against
      # the store, so moving the beads pin or a dependency moves what this
      # seeds instead of quietly seeding what the lock used to name. Both
      # checks are named because they carry different halves of it: the
      # dependency build for the release profile hangs off build-and-test, and
      # the one for dev off clippy.
      - name: seed the source-independent builds into the shared cache
        run: |
          mapfile -t roots < <(nix path-info --derivation \
            .#checks.x86_64-linux.build-and-test \
            .#checks.x86_64-linux.clippy)
          mapfile -t drvs < <(nix-store -qR --include-outputs "${roots[@]}" |
            grep -E '/[a-z0-9]+-(beads|beady-eye(-dev)?-deps)-[^/]*\.drv$')

          # Each of the three has to be in there by name. A total is the wrong
          # thing to count — beads brings several derivations of its own, so a
          # renamed dependency build would hide behind them and this would seed
          # less than it reads as seeding.
          for want in beads beady-eye-deps beady-eye-dev-deps; do
            printf '%s\n' "${drvs[@]}" |
              grep -qE "/[a-z0-9]+-$want-[^/]*\.drv\$" || {
                echo "nothing named $want among the checks' inputs — it was"
                echo "renamed, and this step no longer seeds what it says it does."
                exit 1
              }
          done

          # --outputs answers from the derivation, so it names paths that were
          # never realised: once bd itself substitutes, nothing builds its
          # module closure and that output is not on this machine to push.
          mapfile -t paths < <(nix-store -q --outputs "${drvs[@]}")
          seed=()
          for path in "${paths[@]}"; do
            if nix-store --check-validity "$path" 2>/dev/null; then
              seed+=("$path")
            fi
          done
          test "${#seed[@]}" -gt 0
          printf 'seeding %s\n' "${seed[@]}"

          # --inputs-from takes attic from this flake's locked nixpkgs. A bare
          # nixpkgs# resolves through the installer's registry to a weekly
          # channel, which is an unpinned dependency of every CI run.
          attic() { nix run --inputs-from . nixpkgs#attic-client -- "$@"; }

          attic login homelab https://cache.example.invalid "$ATTIC_TOKEN"
          attic push homelab "${seed[@]}"

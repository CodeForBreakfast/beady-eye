name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is not one of the activity types a pull request triggers on by
    # default — those are opened, synchronize and reopened, all of which move
    # the head. A title is not the head: without this, a valid title passes
    # the subject check, the title is then edited to anything at all, no run
    # fires because nothing was pushed, and the old success stays attached to
    # the same commit right through the squash. The check would read green on
    # a subject nothing had ever checked.
    #
    # It costs a run per title or body edit. That run is the same tree as the
    # one before it and reads what that one left in this pull request's own
    # slice of the cache, so every check substitutes. Editing while a run is
    # still going is the case that costs: the concurrency group below cancels
    # it before it has written any of that, and what replaces it starts cold.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# A push to a pull request's branch supersedes the run on its old head, so
# that run is cancelled, queued or running. A push to main is never
# superseded: every squash needs its own verdict, because closing the work
# behind it reads that run, so those group by sha and share with nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Both jobs below are reachable from a fork's pull request, and such a run
# checks out and executes the fork's own code — its workflow file, its
# flake.nix, its tests. So they run on runners GitHub owns rather than on ones
# this org owns, whose credentials reach a binary cache other repositories
# here trust.
jobs:
  conventional-subject:
    name: conventional subject
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only a pull request has a title. A push to main is the squash of one
    # that passed this, carrying the subject this already read.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # This repository squash-merges and GitHub takes the subject from the
      # pull request's title, so the title is the string main keeps and a
      # branch's own commit messages are squashed away. The rule and its test
      # live in the flake beside the tree scans; what is here is the trigger,
      # because a title is not in the tree a check reads and nothing inside
      # `nix flake check` can be handed one.
      #
      # Through the environment rather than into the `run:` line: the title is
      # written by whoever opened the pull request, and `${{ }}` would paste it
      # into the script before bash ever saw it.
      - name: the subject main will carry
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: nix run .#conventional-subject -- "$TITLE"

  flake-check:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Actions are pinned by commit because a tag is mutable and an action
      # runs with this repository's token.
      #
      # The whole history, because the step below evaluates main's flake
      # beside this tree's and a pull request is checked out as a merge ref
      # with nothing else fetched.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Everything this job builds goes into the GitHub Actions cache, which
      # costs nothing, needs no account and no secret, and is scoped per
      # branch — a fork's pull request writes only into its own scope, so a
      # cache no other run can read is the whole of what a hostile one gets.
      #
      # That scoping is also why this is not the cache it replaces. A cache
      # written on a pull request is unreadable from main, so the squash's run
      # builds this tree's checks a second time rather than substituting them.
      # What does carry is the other direction, main to pull request: the
      # dependency graph keyed on Cargo.lock and beads' module fetch, which
      # between them are most of a cold run.
      #
      # The cache fills to its cap and is meant to. Nothing reads a superseded
      # entry or a merged pull request's scope again, and last access is the
      # order GitHub evicts in, so the cap takes the dead ones first.
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          # Build results stay in this repository's own Actions cache. The
          # FlakeHub upload is a third party and an account, and it wants an
          # id-token this workflow does not grant.
          use-flakehub: false

      # A pull request that changes no file any check reads asks for the very
      # derivations main has already been given a verdict on, so building them
      # again can only arrive at that same verdict. This is what makes that
      # cheap without a cache to substitute from: the run does not build them.
      #
      # Which changes those are is a question for the flake rather than a list
      # of documentation paths kept here. A derivation path answers for the
      # source, for flake.nix and for flake.lock at once, so a dependency bump
      # or an edited check is caught by construction and there is no second
      # list here to fall out of step with the one in flake.nix.
      #
      # Only a pull request may skip. A push to main is the run a bead close
      # reads, and leaving that one unconditional means a mistake here costs a
      # pull request its early exit and can never put an untested tree on main.
      #
      # A release also reads it. `await-ci-verdict` publishes on this run
      # rather than building anything of its own, and it accepts only a push
      # to main precisely because that one cannot have taken the exit above.
      # Widen this to any other event and a release publishes on a run that
      # built nothing.
      - name: what main has not already built
        id: unbuilt
        if: github.event_name == 'pull_request'
        run: |
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          derivations() {
            nix eval --json "$1#checks.$system" \
              --apply 'builtins.mapAttrs (_: check: check.drvPath)'
          }

          # Unpacked rather than checked out, so what is evaluated is main's
          # committed tree and nothing this job has since put beside it.
          base="$RUNNER_TEMP/main"
          mkdir -p "$base"
          git archive origin/main | tar -x -C "$base"

          if [ "$(derivations .)" = "$(derivations "path:$base")" ]; then
            echo "Every check here is a derivation main has already had a verdict on."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      # Every check comes from the flake's `checks` output, so a check added
      # there is a check this runs. Naming one here is the drift to avoid.
      # The conventional-subject job above is the single thing that cannot
      # come from there — it reads a pull request title rather than a tree —
      # and it holds only the trigger, never the rule.
      #
      # The step above is skipped on a push to main, which leaves its output
      # empty rather than "false", so main always builds.
      - if: steps.unbuilt.outputs.any != 'false'
        run: nix flake check -L

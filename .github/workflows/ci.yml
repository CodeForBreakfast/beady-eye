name: CI

on:
  push:
    branches: [main]
    # The tracker writes to .beads on main constantly. Those commits change no
    # code, so they must not spend a runner.
    paths-ignore:
      - '.beads/**'

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check
    runs-on: homelab-runners
    timeout-minutes: 60
    steps:
      # Actions are pinned by commit because a tag is mutable and an action
      # runs with this repository's token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Every check comes from the flake's `checks` output, so a check added
      # there is a check this runs. Naming one here is the drift to avoid.
      - run: nix flake check -L

      # beads-1.2.2-go-modules fetches the whole Go module closure over the
      # network, and that is more than half of this job. It is fixed-output, so
      # any cache can serve it, and nothing had ever pushed it to one.
      #
      # The path comes out of the derivation graph rather than a match against
      # the store, so moving the beads pin moves what this seeds instead of
      # quietly seeding the version the pin used to name.
      - name: seed the beads module closure into the shared cache
        run: |
          check=$(nix path-info --derivation .#checks.x86_64-linux.build-and-test)
          modules=$(nix-store -qR --include-outputs "$check" | grep -E 'beads-[^/]*-go-modules\.drv$')
          test "$(printf '%s' "$modules" | grep -c .)" -eq 1

          # --inputs-from takes attic from this flake's locked nixpkgs. A bare
          # nixpkgs# resolves through the installer's registry to a weekly
          # channel, which is an unpinned dependency of every CI run.
          attic() { nix run --inputs-from . nixpkgs#attic-client -- "$@"; }

          attic login homelab https://cache.example.invalid "$ATTIC_TOKEN"
          attic push homelab "$(nix-store -q --outputs "$modules")"

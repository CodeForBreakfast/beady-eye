name: Release

# A tag is a candidate, not a release. This decides whether it becomes one.
on:
  # The tag has to be pushed with a person's credentials. GitHub suppresses
  # workflow triggers for a ref pushed with the default GITHUB_TOKEN, so a tag
  # push automated from a workflow here would leave no run and no error behind.
  # workflow_dispatch is a documented exception to that suppression, so such a
  # workflow can still reach this one by dispatching it.
  push:
    tags:
      - 'v*'

  # Actions re-runs a job, never a step, so a run that dies after cargo publish
  # cannot simply be repeated: crates.io already holds the version and refuses
  # it a second time. Dispatching on the tag from a later stage is what turns
  # that half-release into a whole one.
  workflow_dispatch:
    inputs:
      from:
        description: the stage to start from
        type: choice
        default: publish
        options:
          - publish
          - announce

permissions:
  contents: write

jobs:
  # A Linux runner cannot produce a Mach-O binary, so the Darwin builds are
  # their own job and the release job waits on them. They run first on purpose:
  # a Darwin build that fails costs a deleted tag, where anything failing after
  # `cargo publish` costs a version crates.io will not take back.
  #
  # Nothing here is guarded by the `from` input. A resume is a fresh run
  # holding no artifacts, so a job skipped on one leaves the announcement with
  # nothing to attach and no way to finish the tag it exists to finish.
  darwin-binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # Nothing here writes to the repository; the release job holds that.
    permissions:
      contents: read
    strategy:
      # Each binary is built on the architecture it is for and run there before
      # it is handed on, so neither ships without having executed once.
      # macos-15-intel is the last x86_64 image GitHub offers and it goes in
      # autumn 2027; cross-compiling that target from an arm64 runner is what
      # replaces it.
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The runner's own Rust rather than the flake's. What pins the toolchain
      # this code is tested with is `nix flake check` below; this job compiles
      # the same locked sources for a platform that check cannot reach, and
      # installing nix here to substitute a Darwin toolchain would put an
      # uncached build on the path to `cargo publish`.
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # An unrun binary is what ships broken.
      - name: the binary runs
        run: ./target/${{ matrix.target }}/release/bdi --version

      # The checksum sits beside its own binary rather than in one combined
      # file, so `shasum -a 256 -c` takes the file downloaded next to it.
      - name: name it for its target and checksum it
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/bdi" "dist/bdi-${{ matrix.target }}"
          cd dist
          shasum -a 256 "bdi-${{ matrix.target }}" > "bdi-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdi-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # A binary linked against the runner image's glibc refuses to start on any
  # distribution older than that image, and says so as a GLIBC_2.xx link error
  # with nothing pointing at the cause. musl is linked statically instead, so
  # the binary asks the machine it lands on for nothing. Rust ships the crt
  # objects for these targets, and the dependency tree compiles no C, so a
  # musl C toolchain is not among the things this needs.
  linux-binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # As with the Darwin pair, each binary is built on the architecture it is
      # for and run there before it is handed on. arm64 Linux runners are free
      # to public repositories, which is what this one is.
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The image carries only its own host target, so the musl standard
      # library has to be asked for.
      - name: the target's standard library
        run: rustup target add ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: the binary runs
        run: ./target/${{ matrix.target }}/release/bdi --version

      # macOS ships no sha256sum and a minimal Linux ships no shasum, so each
      # platform's job writes the checksum with the tool that platform has.
      # The format is the same, so the two sets of assets do not differ.
      - name: name it for its target and checksum it
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/bdi" "dist/bdi-${{ matrix.target }}"
          cd dist
          sha256sum "bdi-${{ matrix.target }}" > "bdi-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdi-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: publish ${{ github.ref_name }}
    needs: [darwin-binaries, linux-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Actions are pinned by commit because a tag is mutable and an action
      # runs with this repository's token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # The flake reads its version from Cargo.toml, so this one comparison
      # covers both artefacts: a tag that passes it names the version the crate
      # declares and the version the flake output carries. It runs on a resume
      # too, where it checks that the tag being finished names the version that
      # was published.
      #
      # The notes file is checked here rather than beside the step that reads
      # it, which runs after `cargo publish` and so after the one thing
      # crates.io will not take back. A resume that cannot announce should not
      # start either.
      - name: the tag must name the version the tree declares, and its notes must be written
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(nix eval --raw .#packages.x86_64-linux.default.version)
          echo "tag $tagged, tree $declared"
          test "$tagged" = "$declared"
          test -f "RELEASE-NOTES/$tagged.md" || {
            echo "::error::RELEASE-NOTES/$tagged.md is missing, so this release has no body anybody wrote. See RELEASE-NOTES/README.md."
            exit 1
          }

      # A resume skips every step guarded the way this one is. The guard reads
      # the event payload rather than the `inputs` context, which is only
      # available to a dispatched run; the payload is empty on a push, so a push
      # runs the lot.
      #
      # Both of these fail the publish anyway, seven minutes later, with the
      # tag already pushed. Saying so first costs nothing.
      - name: the publish preconditions
        if: github.event.inputs.from != 'announce'
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || {
            echo "::error::CARGO_REGISTRY_TOKEN is not set; nothing can be published"
            exit 1
          }
          grep -q '^license' Cargo.toml || {
            echo "::error::Cargo.toml sets no license; crates.io refuses a crate without one"
            exit 1
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # crates.io cannot take a version back — a yank still serves the files —
      # so the tested-commit gate is re-run here rather than assumed from the
      # push build. Every check comes from the flake's `checks` output.
      - name: nix flake check
        if: github.event.inputs.from != 'announce'
        run: nix flake check -L

      # The one irreversible step, and the last thing that can fail without
      # leaving a mess. cargo verifies the packaged tree builds before it
      # uploads, so a packaging fault stops here having published nothing.
      #
      # The dev shell is the toolchain the checks above ran against; a cargo
      # from anywhere else is a second, unpinned Rust.
      - name: cargo publish
        if: github.event.inputs.from != 'announce'
        run: nix develop -c cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Unguarded for the same reason the Darwin jobs are: a resume announces
      # nothing if this is skipped.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: bdi-*
          merge-multiple: true

      # The announcement, deliberately after the irreversible step. A release
      # exists when this has run: the crate is up, and the tag it names gives
      # the flake output at the same version from the same commit. A tag with
      # no release is the half-release, and dispatching this workflow on that
      # tag with from=announce is the whole of the repair.
      #
      # gh comes from this flake's locked nixpkgs. A bare nixpkgs# resolves
      # through the installer's registry to a weekly channel, which is an
      # unpinned dependency of every release.
      - name: announce the release
        # Two commands that can each be run again, rather than one create
        # carrying its assets. The atomic form is the one to want and it is
        # given up on purpose: `gh release create` refuses a tag it has already
        # announced, so a create that succeeded with an upload that did not
        # would leave a Release the from=announce repair could not finish. What
        # this costs instead is a Release briefly without its binaries during a
        # run that is going well, and the next command closes that.
        #
        # Every asset is named rather than globbed, so an upload cannot quietly
        # leave one out: a pattern matching nothing uploads nothing and says
        # the step passed.
        run: |
          gh() { nix run --inputs-from . nixpkgs#gh -- "$@"; }
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "RELEASE-NOTES/${GITHUB_REF_NAME#v}.md"
          gh release upload "$GITHUB_REF_NAME" \
            dist/bdi-aarch64-apple-darwin \
            dist/bdi-aarch64-apple-darwin.sha256 \
            dist/bdi-x86_64-apple-darwin \
            dist/bdi-x86_64-apple-darwin.sha256 \
            dist/bdi-aarch64-unknown-linux-musl \
            dist/bdi-aarch64-unknown-linux-musl.sha256 \
            dist/bdi-x86_64-unknown-linux-musl \
            dist/bdi-x86_64-unknown-linux-musl.sha256 \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

name: Release

# A merge to main is a candidate, not a release. This decides whether it
# becomes one.
on:
  # Merging the version bump is the only human act in a release. Everything
  # outward-facing from there is this workflow's.
  push:
    branches:
      - main

  # Actions re-runs a job, never a step, so a run that dies after cargo publish
  # cannot simply be repeated: crates.io already holds the version and refuses
  # it a second time. Dispatching on the tag from a later stage is what turns
  # that half-release into a whole one.
  workflow_dispatch:
    inputs:
      from:
        description: the stage to start from
        type: choice
        default: publish
        options:
          - publish
          - announce

permissions:
  contents: write

jobs:
  # Most merges to main release nothing, so this job answers the question once
  # and every other job hangs off its answer. An ordinary merge skips the lot
  # rather than failing.
  #
  # The version comes out of Cargo.toml. Reading it needs no nix and no
  # toolchain, so a merge that turns out not to be a release costs seconds.
  detect:
    name: is this merge a release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A dispatch is a repair on a tag that already exists, so it answers yes
      # without asking either question — the push that cut that tag asked them
      # both before anything was published.
      #
      # A push asks both. The existing tag is what makes every merge after the
      # bump a no-op, and it is also what separates a notes file somebody
      # pruned from one nobody ever wrote. The second of those fails rather
      # than skipping, and goes on failing every merge until the file lands,
      # because what it reports is the state of main rather than the push that
      # reached it.
      - name: decide
        id: decide
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml declares $version"

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          released() { git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; }

          if [ ! -f "RELEASE-NOTES/$version.md" ]; then
            released || {
              echo "::error::Cargo.toml declares $version, RELEASE-NOTES/$version.md is missing and v$version is not tagged, so main declares a version nobody released and no release can be cut for it. See RELEASE-NOTES/README.md."
              exit 1
            }
            echo "v$version is released and its notes file is gone, so this merge releases nothing"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if released; then
            echo "v$version is already tagged, so this merge releases nothing"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"

  # A Linux runner cannot produce a Mach-O binary, so the Darwin builds are
  # their own job and the release job waits on them. They run first on purpose:
  # a Darwin build that fails costs nothing, where anything failing after
  # `cargo publish` costs a version crates.io will not take back.
  #
  # Nothing here is guarded by the `from` input. A resume is a fresh run
  # holding no artifacts, so a job skipped on one leaves the announcement with
  # nothing to attach and no way to finish the tag it exists to finish. The
  # `if` below is the release gate rather than a stage guard, and a dispatch
  # always passes it.
  darwin-binaries:
    name: build ${{ matrix.target }}
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # Nothing here writes to the repository; the release job holds that.
    permissions:
      contents: read
    strategy:
      # Each binary is built on the architecture it is for and run there before
      # it is handed on, so neither ships without having executed once.
      # macos-15-intel is the last x86_64 image GitHub offers and it goes in
      # autumn 2027; cross-compiling that target from an arm64 runner is what
      # replaces it.
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The runner's own Rust rather than the flake's. What pins the toolchain
      # this code is tested with is `nix flake check` below; this job compiles
      # the same locked sources for a platform that check cannot reach, and
      # installing nix here to substitute a Darwin toolchain would put an
      # uncached build on the path to `cargo publish`.
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # An unrun binary is what ships broken.
      - name: the binary runs
        run: ./target/${{ matrix.target }}/release/bdi --version

      # The checksum sits beside its own binary rather than in one combined
      # file, so `shasum -a 256 -c` takes the file downloaded next to it.
      - name: name it for its target and checksum it
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/bdi" "dist/bdi-${{ matrix.target }}"
          cd dist
          shasum -a 256 "bdi-${{ matrix.target }}" > "bdi-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdi-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # A binary linked against the runner image's glibc refuses to start on any
  # distribution older than that image, and says so as a GLIBC_2.xx link error
  # with nothing pointing at the cause. musl is linked statically instead, so
  # the binary asks the machine it lands on for nothing. Rust ships the crt
  # objects for these targets, and the dependency tree compiles no C, so a
  # musl C toolchain is not among the things this needs.
  linux-binaries:
    name: build ${{ matrix.target }}
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # As with the Darwin pair, each binary is built on the architecture it is
      # for and run there before it is handed on. arm64 Linux runners are free
      # to public repositories, which is what this one is.
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The image carries only its own host target, so the musl standard
      # library has to be asked for.
      - name: the target's standard library
        run: rustup target add ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: the binary runs
        run: ./target/${{ matrix.target }}/release/bdi --version

      # macOS ships no sha256sum and a minimal Linux ships no shasum, so each
      # platform's job writes the checksum with the tool that platform has.
      # The format is the same, so the two sets of assets do not differ.
      - name: name it for its target and checksum it
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/bdi" "dist/bdi-${{ matrix.target }}"
          cd dist
          sha256sum "bdi-${{ matrix.target }}" > "bdi-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdi-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # No `if` here: a skipped `needs` skips this too, so the gate is stated once
  # on the jobs above.
  release:
    name: publish v${{ needs.detect.outputs.version }}
    needs: [detect, darwin-binaries, linux-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # `contents` is the tag push and the Release; `actions` is CI's verdict,
    # which this job now waits for rather than re-deriving. The workflow-level
    # block grants `contents` alone and a permissions map grants nothing it
    # does not name, so both are stated here.
    permissions:
      contents: write
      actions: read
    # The tag push, the publish and the announcement are one sequence against
    # state nothing can take back, so only one run may be inside it for a
    # version. Per version rather than global: GitHub cancels a pending run
    # when a third enters the group, and a global group would spend that
    # cancellation on a different version's release.
    concurrency:
      group: release-${{ needs.detect.outputs.version }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      TAG: v${{ needs.detect.outputs.version }}
      TAP: CodeForBreakfast/homebrew-tap
    steps:
      # Actions are pinned by commit because a tag is mutable and an action
      # runs with this repository's token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # The flake reads its own version from Cargo.toml through a path nothing
      # else here exercises, and it is what `nix flake check` and every binary
      # a consumer builds go through.
      #
      # The tag is what a resume checks, both ways round. `from=announce`
      # finishes a release that has already published, so its tag exists by
      # definition; without that check a dispatch on an untagged branch would
      # cut a tag and announce a Release for a version crates.io never took,
      # and the tag would then make every later merge a no-op. And an existing
      # tag has to be this commit's, or the run is finishing a release for a
      # tree that did not produce it.
      #
      # The notes file is checked here rather than beside the step that reads
      # it, which runs after `cargo publish` and so after the one thing
      # crates.io will not take back. A resume that cannot announce should not
      # start either.
      - name: the version gate
        run: |
          declared=$(nix eval --raw .#packages.x86_64-linux.default.version)
          echo "Cargo.toml $VERSION, flake $declared"
          test "$VERSION" = "$declared"

          existing=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ "$FROM" = announce ] && [ -z "$existing" ]; then
            echo "::error::$TAG does not exist, so there is no release for from=announce to finish"
            exit 1
          fi
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG already names $existing, not the commit this run is on"
            exit 1
          fi

          test -f "RELEASE-NOTES/$VERSION.md" || {
            echo "::error::RELEASE-NOTES/$VERSION.md is missing, so this release has no body anybody wrote. See RELEASE-NOTES/README.md."
            exit 1
          }
        env:
          FROM: ${{ github.event.inputs.from }}

      # A resume skips every step guarded the way this one is. The guard reads
      # the event payload rather than the `inputs` context, which is only
      # available to a dispatched run; the payload is empty on a push, so a push
      # runs the lot.
      #
      # Both of these fail the publish anyway, seven minutes later. Saying so
      # first costs nothing.
      - name: the publish preconditions
        if: github.event.inputs.from != 'announce'
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || {
            echo "::error::CARGO_REGISTRY_TOKEN is not set; nothing can be published"
            exit 1
          }
          grep -q '^license' Cargo.toml || {
            echo "::error::Cargo.toml sets no license; crates.io refuses a crate without one"
            exit 1
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # The tap credential cannot be checked in the step above, because a
      # resume skips that step and still writes the tap. It is checked here for
      # the same reason that one gives: the push fails anyway, and by then the
      # release has announced and the failure reads as a broken release rather
      # than a missing secret.
      #
      # The tap is public, and git sends no credentials to a server that does
      # not ask for them — so cloning or listing it proves nothing about the
      # token, and a revoked one would read as a working one right up until the
      # push. The API is asked instead, because it refuses a credential it does
      # not accept whether or not the repository is public.
      #
      # What the answer proves is one direction only. A fine-grained token
      # cannot carry more than its owner has, so `push: false` is a token that
      # certainly cannot write; `push: true` may still be the owner's access
      # rather than the token's contents grant, and nothing short of a write
      # tells those apart. The push below is where that is settled, and this is
      # what keeps the ordinary spelling of a wrong secret — unset, revoked,
      # expired, or made for the wrong repository — out of the minutes after
      # cargo publish.
      - name: the tap precondition
        run: |
          test -n "$GH_TOKEN" || {
            echo "::error::HOMEBREW_TAP_TOKEN is not set, so this release cannot write $TAP. It is a fine-grained token with contents write on that repository; github.token will not do, because it is scoped to this one."
            exit 1
          }

          gh() { nix run --inputs-from . nixpkgs#gh -- "$@"; }
          push="$( gh api "repos/$TAP" --jq .permissions.push )" || {
            echo "::error::GitHub would not answer for $TAP with HOMEBREW_TAP_TOKEN, so this release cannot write the tap. A revoked or expired token is what this looks like."
            exit 1
          }
          [ "$push" = true ] || {
            echo "::error::HOMEBREW_TAP_TOKEN does not carry write on $TAP; GitHub reports push access as '$push'. It is a fine-grained token with contents write on that repository."
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # crates.io cannot take a version back — a yank still serves the files —
      # so nothing is published on a tree that has not been through the whole
      # of `nix flake check`. This waits for that check rather than running it:
      # the same push starts CI on this commit, CI builds every check the
      # flake declares, and a second build of one tree cannot say anything the
      # first did not while it can disagree with it.
      #
      # `await-ci-verdict` is what makes that safe, and the decision it makes
      # is checked — `await-ci-verdict-test` in the flake holds every
      # conclusion GitHub can give against the exit this wants for it. What is
      # not checked is this step: no gate here reads a workflow file.
      #
      # A push to main cannot have its CI run cancelled out from under this.
      # ci.yml groups a push by sha and shares that group with nothing, so
      # nothing supersedes it and only a person pressing cancel can end it —
      # which stops the release rather than hanging it.
      - name: CI's verdict for this commit
        if: github.event.inputs.from != 'announce'
        run: nix run .#await-ci-verdict -- "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

      # The record of which commit produced the release, cut last of everything
      # that can still fail cheaply. A tag naming a version is a claim that the
      # version was released, and the claim is what makes every later merge to
      # main a no-op — so a tag pushed ahead of a check that then fails leaves
      # the fix unreleasable without somebody deleting it by hand.
      #
      # GitHub suppresses workflow triggers for a ref pushed with the default
      # token. Nothing triggers on this tag, so that costs nothing.
      #
      # A resume runs this against a tag it pushed itself, so it asks first.
      - name: tag the commit this release is cut from
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || {
            git tag "$TAG"
            git push origin "$TAG"
          }

      # The one irreversible step, and the last thing that can fail without
      # leaving a mess. cargo verifies the packaged tree builds before it
      # uploads, so a packaging fault stops here having published nothing.
      #
      # The dev shell is the toolchain the checks above ran against; a cargo
      # from anywhere else is a second, unpinned Rust.
      - name: cargo publish
        if: github.event.inputs.from != 'announce'
        run: nix develop -c cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Unguarded for the same reason the Darwin jobs are: a resume announces
      # nothing if this is skipped.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: bdi-*
          merge-multiple: true

      # The announcement, deliberately after the irreversible step. A release
      # exists when this has run: the crate is up, and the tag it names gives
      # the flake output at the same version from the same commit. A tag with
      # no release is the half-release, and dispatching this workflow on that
      # tag with from=announce is the whole of the repair.
      #
      # gh comes from this flake's locked nixpkgs. A bare nixpkgs# resolves
      # through the installer's registry to a weekly channel, which is an
      # unpinned dependency of every release.
      - name: announce the release
        # Two commands that can each be run again, rather than one create
        # carrying its assets. The atomic form is the one to want and it is
        # given up on purpose: `gh release create` refuses a tag it has already
        # announced, so a create that succeeded with an upload that did not
        # would leave a Release the from=announce repair could not finish. What
        # this costs instead is a Release briefly without its binaries during a
        # run that is going well, and the next command closes that.
        #
        # Every asset is named rather than globbed, so an upload cannot quietly
        # leave one out: a pattern matching nothing uploads nothing and says
        # the step passed.
        run: |
          gh() { nix run --inputs-from . nixpkgs#gh -- "$@"; }
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "RELEASE-NOTES/$VERSION.md"
          gh release upload "$TAG" \
            dist/bdi-aarch64-apple-darwin \
            dist/bdi-aarch64-apple-darwin.sha256 \
            dist/bdi-x86_64-apple-darwin \
            dist/bdi-x86_64-apple-darwin.sha256 \
            dist/bdi-aarch64-unknown-linux-musl \
            dist/bdi-aarch64-unknown-linux-musl.sha256 \
            dist/bdi-x86_64-unknown-linux-musl \
            dist/bdi-x86_64-unknown-linux-musl.sha256 \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # A formula in homebrew-core is bumped by Homebrew's own bot; a tap gets
      # no such service, so the formula serves the version last written into it
      # and this is what writes this one. It runs after the announcement
      # because it points at a Release that has to exist: a tap lagging the
      # Release by a few seconds is recoverable, where a Release that never
      # announced is not.
      #
      # The tap holds a formula per project, and another project's release can
      # push between this clone and this push. So only Formula/bdi.rb is
      # written, and a rejected push is replayed onto what arrived rather than
      # forced over it — a force here discards a formula whose own release has
      # already announced.
      #
      # Unguarded by `from`, because a run that died after cargo publish also
      # died before this, and a guarded step would leave that version's formula
      # unwritten for good. The cost is that a from=announce dispatch on an
      # older tag reaches here too, and the version gate has no opinion about
      # which tag that is — so this declines to write when the tap already
      # serves a newer version than the one being repaired, rather than
      # downgrading every `brew install` to finish an old release.
      - name: update the tap's formula
        run: |
          formula="$RUNNER_TEMP/bdi.rb"
          nix run .#tap-formula -- "$VERSION" dist > "$formula"

          tap="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/$TAP" "$tap"
          branch="$( git -C "$tap" symbolic-ref --short HEAD )"

          # Read afresh on every attempt: a replay is onto whatever arrived,
          # and what arrived can be another bdi release's formula.
          for attempt in 1 2 3; do
            held="$( sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' \
              "$tap/Formula/bdi.rb" | head -1 )"
            newest="$( printf '%s\n%s\n' "$held" "$VERSION" | sort -V | tail -1 )"
            if [ "$held" != "$VERSION" ] && [ "$held" = "$newest" ]; then
              echo "$TAP serves $held, which is later than $TAG, so this leaves it alone"
              exit 0
            fi

            cp "$formula" "$tap/Formula/bdi.rb"
            if git -C "$tap" diff --quiet -- Formula/bdi.rb; then
              echo "$TAP already serves $TAG"
              exit 0
            fi

            git -C "$tap" \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "bdi $VERSION" -- Formula/bdi.rb

            if git -C "$tap" push origin "HEAD:$branch"; then
              echo "$TAP serves $TAG"
              exit 0
            fi

            echo "$TAP moved under this push, so attempt $attempt replays onto it"
            git -C "$tap" fetch origin "$branch"
            git -C "$tap" reset --hard "origin/$branch"
          done

          echo "::error::$TAP would not take Formula/bdi.rb for $TAG. The release itself is out; the tap serves the version before it until this is repaired by dispatching this workflow on $TAG with from=announce."
          exit 1
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

[package]
name = "beady-eye"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A tree of work in flight: bead graphs annotated with the live agents working them"
repository = "https://github.com/CodeForBreakfast/beady-eye"
license = "Apache-2.0"
readme = "README.md"
keywords = ["beads", "herdr", "agents", "tui"]
categories = ["command-line-utilities", "development-tools"]

# An allowlist, not an exclude list. A published version cannot be withdrawn —
# a yank still serves the files — so a file that reaches the tarball is public
# for good. Anything a consumer of the crate does not need stays out.
#
# Every pattern is anchored. Cargo matches these the way gitignore does, so an
# unanchored "README.md" also selects .beads/README.md.
#
# The README's picture is deliberately absent. Cargo sends the README's text in
# the publish request and crates.io never opens the tarball to render it, so an
# image reaches a reader over the network whatever this list says: crates.io
# rewrites the relative path to `<repository>/raw/HEAD/<path>`. Adding the file
# here would grow the tarball and change nothing. What it does mean is that
# every published version's README points at whatever stands at that path on
# the default branch, so `docs/bdi-frame.svg` cannot be moved or deleted
# without breaking the front page of releases already out.
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "beady_eye"
path = "src/lib.rs"

[[bin]]
name = "bdi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
# Which user this run is, which nothing in `std` will say and the socket's way
# down has to be judged against. It is also the pty a test drives bdi through,
# which is what it was here for while it was a dev-dependency. Named for the
# same reason signal-hook is: the crate is compiled either way as signal-hook's
# own, and one reached only through another crate's tree is not one this code
# may `use`.
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Named directly, though crossterm already compiles it for its own resize
# plumbing: a crate reached only through another crate's tree is not one
# this code may `use`, and would go the day crossterm changed its mind.
signal-hook = "0.3"
toml = "0.8"

[features]
# What `tests/` reaches that bdi does not. Cargo builds dev-dependencies only
# for the targets that compile tests, so the package depending on itself here
# is what turns this on for `cargo test` and leaves `cargo build` narrow. See
# src/lib.rs.
testing = []

[dev-dependencies]
beady-eye = { path = ".", features = ["testing"] }
pretty_assertions = "1"
